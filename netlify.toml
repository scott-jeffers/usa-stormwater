# Netlify — static Next.js export (output: "export" → ./out)
# Connect this GitHub repo in Netlify; settings below are picked up automatically.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Do NOT set GEMINI_API_KEY (or any AI keys) here. The site is a static
  # export built from committed JSON in data/documents/ — no secrets needed.

# Retired pages (2026-11 redesign): send old links somewhere useful.
[[redirects]]
  from = "/national/model-manual/*"
  to = "/manual/evidence/"
  status = 301
  force = true

[[redirects]]
  from = "/national/practices/*"
  to = "/requirements/"
  status = 301
  force = true

[[redirects]]
  from = "/national/*"
  to = "/manual/"
  status = 301
  force = true

[[redirects]]
  from = "/national"
  to = "/manual/"
  status = 301
  force = true

# Pretty URLs for trailingSlash: true static export
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers (static site)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Allow tools and AIs to fetch JSON cross-origin
[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
    X-Content-Type-Options = "nosniff"
